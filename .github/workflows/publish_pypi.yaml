name: Build & Publish to PyPI

on:
  push:
    tags:
      - v*

jobs:
  Build:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@8.2.0

      - name: Build
        run: uv build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  Publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    needs:
      - Build

    steps:
      - name: Retrieve release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
