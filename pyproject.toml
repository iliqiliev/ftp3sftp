[project]
name = "ftp3sftp"
description = "A simple FTP to SFTP bridge. Fork of `ftp2sftp`."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Iliya Iliev", email = "iliq0000@proton.me" },
  { name = "Sebastian Meyer", email = "sparrow.242.de@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

dependencies = [
  "paramiko>=5.0.0",
  "pyftpdlib>=2.2.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/iliqiliev/ftp3sftp/issues"
"Homepage" = "https://github.com/iliqiliev/ftp3sftp"

[project.scripts]
ftp3sftp = "ftp3sftp.ftp3sftp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ftp3sftp/__init__.py"

[tool.ruff]
lint.extend-select = [
  "ANN",  # Annotation.
  "TC",  # Type checking.
]
